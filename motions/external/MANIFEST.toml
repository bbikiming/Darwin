# motions/external/MANIFEST.toml
#
# 외부 커뮤니티 `motion_4096.bin` (및 보조 .bin) 파일의 정식 카탈로그.
# 파일 자체는 `research/community/` 하위 원본 클론에 보존하고, 이 매니페스트에서
# SHA-256 · 라이선스 · 페이지 카탈로그 위치 · 소스 출처를 추적한다.
#
# 정합성 규칙:
#   - 모든 `motion_4096.bin` 은 256 페이지 × 512 byte = 131 072 byte (Action.h 의 PAGE 구조 기준).
#   - SHA-256 이 바뀌면 이 항목과 `_catalog/<name>.csv` 를 동시에 재생성한다.
#   - `license_compat` 가 `gpl-isolated` 인 항목은 `forge-core` 가 임포트하면 안 된다 (텍스트·메타·페이지 분석 인용만 허용).
#
# 갱신: 2026-05-12 (Phase 1 확장 — 커뮤니티 모션 DB 구축)

[default]
page_size_bytes        = 512
num_pages              = 256
expected_size_bytes    = 131072
servo_count_in_step    = 31     # position[31], ID 1..20 사용 + 예약
servo_step_position_lsb_unit = "MX-28 4096-tick goal_position"
# 페이지 헤더 schedule 코드: 0x00 = SPEED_BASE, 0x0a = TIME_BASE (Action.h enum)
schedule_codes         = { speed_base = 0x00, time_base = 0x0a }


