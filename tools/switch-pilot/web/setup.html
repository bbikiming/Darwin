<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1280, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>다윈 스위치 — 첫 설정</title>
  <link rel="icon" type="image/png" href="/assets/darwin-icon.png" />
  <style>
    /* Self-contained; palette mirrors styles.css. No remote fonts/libs. */
    :root {
      color-scheme: dark;
      --bg: #111315;
      --panel: #1a1d20;
      --panel-2: #22262a;
      --line: #3a4148;
      --line-soft: #2a3035;
      --text: #f5f7f8;
      --muted: #b4bdc3;
      --dim: #76828b;
      --cyan: #00d6ee;
      --red: #ff4a55;
      --green: #62dc8e;
      --amber: #ffd166;
      --focus: #ffffff;
      --shadow: rgba(0, 0, 0, .34);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .setup-shell {
      width: 1280px;
      min-height: 720px;
      margin: 0 auto;
      padding: 32px 40px 40px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .switch-mark {
      width: 44px;
      height: 44px;
      flex: none;
      border-radius: 8px;
      /* DarwinForge app icon (resized copy) — shared brand mark with the Mac app. */
      background: #101316 center / cover no-repeat url("/assets/darwin-icon.png");
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .28);
    }

    h1 { margin: 0; font-size: 26px; font-weight: 820; line-height: 1; }
    .subtitle { margin: 4px 0 0; color: var(--muted); font-size: 14px; }

    .card {
      border: 1px solid var(--line-soft);
      background: #181b1e;
      border-radius: 10px;
      box-shadow: 0 14px 32px var(--shadow);
      padding: 22px 26px;
    }

    fieldset { border: 0; margin: 0; padding: 0; }
    legend {
      font-size: 13px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--dim);
      padding: 0;
      margin-bottom: 14px;
    }

    .mode-row { display: flex; gap: 14px; flex-wrap: wrap; }

    .mode-option {
      flex: 1 1 0;
      min-width: 220px;
      border: 2px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      padding: 16px 18px;
      cursor: pointer;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .mode-option:hover { border-color: var(--cyan); }
    .mode-option:has(input:checked) {
      border-color: var(--cyan);
      background: var(--panel-2);
    }
    .mode-option:has(input:focus-visible) {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    .mode-option input { margin-top: 4px; width: 22px; height: 22px; accent-color: var(--cyan); }
    .mode-option strong { display: block; font-size: 16px; }
    .mode-option span { display: block; color: var(--muted); font-size: 13px; margin-top: 4px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px 22px;
      margin-top: 16px;
    }

    label.field { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
    label.field .hint { color: var(--dim); font-size: 12px; }

    input[type="text"],
    input[type="number"],
    input[type="password"] {
      font: inherit;
      color: var(--text);
      background: var(--panel);
      border: 2px solid var(--line);
      border-radius: 8px;
      padding: 12px 14px;
      min-height: 48px;
    }

    input:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
      border-color: var(--cyan);
    }

    .toggle-row { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
    .toggle-row input { width: 24px; height: 24px; accent-color: var(--cyan); }

    .hidden { display: none !important; }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 4px;
    }

    #status { font-size: 14px; min-height: 20px; }
    #status.error { color: var(--red); }
    #status.ok { color: var(--green); }
    #status.busy { color: var(--amber); }

    button.primary {
      font: inherit;
      font-weight: 720;
      font-size: 16px;
      color: #08171a;
      background: var(--cyan);
      border: 0;
      border-radius: 10px;
      padding: 14px 30px;
      min-height: 52px;
      cursor: pointer;
    }
    button.primary:hover { filter: brightness(1.08); }
    button.primary:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
    button.primary:disabled { opacity: .5; cursor: not-allowed; }
  </style>
</head>
<body>
  <main class="setup-shell">
    <header>
      <div class="switch-mark" aria-hidden="true"></div>
      <div>
        <h1>다윈 스위치 — 첫 설정</h1>
        <p class="subtitle">조종 방식을 고르고 맥 또는 로봇을 지정하세요. 키보드 없이 설정할 수 있어요.</p>
      </div>
    </header>

    <form id="setup-form" class="card" autocomplete="off">
      <fieldset>
        <legend>조종 방식</legend>
        <div class="mode-row" role="radiogroup" aria-label="조종 방식">
          <label class="mode-option">
            <input type="radio" name="mode" value="dry_run" />
            <span>
              <strong>연습 모드</strong>
              <span>화면만 동작해요. 로봇으로 아무것도 보내지 않아요.</span>
            </span>
          </label>
          <label class="mode-option">
            <input type="radio" name="mode" value="mac_relay" />
            <span>
              <strong>맥 경유</strong>
              <span>맥의 DarwinForge 앱을 거쳐 조종해요.</span>
            </span>
          </label>
          <label class="mode-option">
            <input type="radio" name="mode" value="robot_udp" />
            <span>
              <strong>로봇 직결 (UDP)</strong>
              <span>네트워크로 로봇에 바로 연결해요.</span>
            </span>
          </label>
          <label class="mode-option">
            <input type="radio" name="mode" value="ssh" />
            <span>
              <strong>로봇 직접 조종 (SSH)</strong>
              <span>SSH로 로봇 내장 보행 프로그램을 직접 조종해요.</span>
            </span>
          </label>
        </div>
      </fieldset>

      <fieldset id="mac-section">
        <legend>맥 연결</legend>
        <div class="grid">
          <label class="field">
            맥 호스트 / IP
            <input type="text" id="mac-host" inputmode="decimal" placeholder="192.168.123.1" />
            <span class="hint">DarwinForge가 실행 중인 맥이에요.</span>
          </label>
          <label class="field">
            맥 포트
            <input type="number" id="mac-port" min="0" max="65535" placeholder="8770" />
          </label>
          <label class="field">
            페어링 코드
            <input type="text" id="mac-pairing" inputmode="numeric" pattern="[0-9]*" placeholder="123456" />
            <span class="hint">맥 앱 화면에 표시된 숫자예요.</span>
          </label>
        </div>
      </fieldset>

      <fieldset id="robot-section">
        <legend>로봇 연결</legend>
        <div class="grid">
          <label class="field">
            로봇 호스트 / IP
            <input type="text" id="robot-host" inputmode="decimal" placeholder="192.168.0.100" />
          </label>
          <label class="field">
            로봇 포트
            <input type="number" id="robot-port" min="0" max="65535" placeholder="55310" />
          </label>
          <label class="field">
            토큰 (선택)
            <input type="password" id="robot-token" placeholder="없으면 비워 두세요" />
          </label>
        </div>
      </fieldset>

      <fieldset id="ssh-section">
        <legend>SSH 연결</legend>
        <div class="grid">
          <label class="field">
            로봇 호스트 / IP
            <input type="text" id="ssh-host" inputmode="decimal" placeholder="192.168.123.1" />
            <span class="hint">유선 직결이 가장 빨라요 (192.168.123.1).</span>
          </label>
          <label class="field">
            SSH 사용자
            <input type="text" id="ssh-user" autocapitalize="off" spellcheck="false" placeholder="robotis" />
          </label>
          <label class="field">
            SSH 포트 (선택)
            <input type="number" id="ssh-port" min="1" max="65535" placeholder="22" />
          </label>
          <label class="field">
            키 파일 (선택)
            <input type="text" id="ssh-identity" autocapitalize="off" spellcheck="false" placeholder="~/.ssh/id_rsa_darwin" />
            <span class="hint">RSA 키 — 구형 OpenSSH 5.9는 ed25519를 지원하지 않아요.</span>
          </label>
        </div>
      </fieldset>

      <fieldset>
        <legend>화면</legend>
        <div class="toggle-row">
          <input type="checkbox" id="camera-enabled" />
          <label for="camera-enabled">카메라 화면 표시 켜기</label>
        </div>
        <div class="toggle-row">
          <input type="checkbox" id="model3d-enabled" />
          <label for="model3d-enabled">3D 로봇 모델 표시 (저사양이면 끄기)</label>
        </div>
      </fieldset>

      <div class="footer">
        <p id="status" role="status" aria-live="polite"></p>
        <button type="submit" class="primary" id="save-btn">저장하고 조종 시작</button>
      </div>
    </form>
  </main>
  <script src="setup.js"></script>
</body>
</html>
