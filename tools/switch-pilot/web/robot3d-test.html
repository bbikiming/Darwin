<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Darwin 3D 모델 점검</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1017;
      --panel: #111922;
      --line: #273445;
      --text: #e7eef7;
      --muted: #8ea0b4;
      --ok: #4ade80;
      --accent: #67e8f9;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
    body {
      width: 1280px;
      height: 720px;
      overflow: hidden;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .shell {
      height: 720px;
      padding: 18px;
      display: grid;
      grid-template-rows: 58px 1fr;
      gap: 14px;
      background:
        linear-gradient(180deg, rgba(103, 232, 249, 0.08), transparent 36%),
        radial-gradient(circle at 78% 12%, rgba(74, 222, 128, 0.12), transparent 24%),
        var(--bg);
    }

    .topbar {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(17, 25, 34, 0.78);
    }

    .title {
      display: flex;
      flex-direction: column;
      gap: 3px;
      line-height: 1.1;
    }

    .title strong { font-size: 18px; letter-spacing: 0; }
    .title span { color: var(--muted); font-size: 12px; letter-spacing: 0; }

    #status {
      min-width: 130px;
      padding: 8px 10px;
      border: 1px solid rgba(103, 232, 249, 0.38);
      border-radius: 8px;
      text-align: center;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0;
      background: rgba(103, 232, 249, 0.08);
    }

    body.ready #status {
      color: var(--ok);
      border-color: rgba(74, 222, 128, 0.45);
      background: rgba(74, 222, 128, 0.08);
    }

    .grid {
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .panel {
      min-width: 0;
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: var(--panel);
      display: grid;
      grid-template-rows: 42px 1fr;
    }

    .label {
      padding: 10px 12px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid rgba(39, 52, 69, 0.78);
      background: rgba(255, 255, 255, 0.025);
    }

    .label strong { font-size: 13px; letter-spacing: 0; }
    .label span { color: var(--muted); font-size: 11px; letter-spacing: 0; white-space: nowrap; }

    .viewport {
      position: relative;
      min-height: 0;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.055), transparent 34%),
        radial-gradient(circle at 50% 45%, rgba(103, 232, 249, 0.11), transparent 45%),
        #0a0f15;
    }

    .viewport::after {
      content: "";
      position: absolute;
      inset: auto 14% 12px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(231, 238, 247, 0.32), transparent);
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="title">
        <strong>DARwIn GLB 모델 검수</strong>
        <span>정면/좌측/우측/후면 렌더로 GLB 적용과 머리 방향을 확인</span>
      </div>
      <div id="status">LOADING</div>
    </header>

    <section class="grid" aria-label="Darwin 3D model views">
      <article class="panel">
        <div class="label"><strong>정면</strong><span>HEAD FRONT</span></div>
        <div class="viewport" id="view-front"></div>
      </article>
      <article class="panel">
        <div class="label"><strong>좌측</strong><span>LEFT SIDE</span></div>
        <div class="viewport" id="view-left"></div>
      </article>
      <article class="panel">
        <div class="label"><strong>우측</strong><span>RIGHT SIDE</span></div>
        <div class="viewport" id="view-right"></div>
      </article>
      <article class="panel">
        <div class="label"><strong>후면</strong><span>REAR</span></div>
        <div class="viewport" id="view-rear"></div>
      </article>
    </section>
  </main>

  <script type="module">
    import { mountRobot } from "./robot3d.js";

    const views = [
      ["view-front", "front"],
      ["view-left", "left"],
      ["view-right", "right"],
      ["view-rear", "rear"],
    ];

    try {
      await Promise.all(views.map(([id, cameraView]) => mountRobot(
        document.getElementById(id),
        { autoRotate: false, cameraView, distanceScale: 1.18, lighting: "inspection" },
      )));
      document.body.classList.add("ready");
      document.getElementById("status").textContent = "GLB APPLIED";
      await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
      window.__ready = true;
    } catch (error) {
      document.getElementById("status").textContent = "LOAD FAILED";
      window.__robot3dError = String(error && error.stack || error);
      throw error;
    }
  </script>
</body>
</html>
