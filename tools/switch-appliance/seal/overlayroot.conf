# Managed by darwin-switch-appliance seal/overlayroot.sh — do not edit by hand.
#
# Makes the root filesystem read-only with a tmpfs overlay: every write to /
# lands in RAM and is discarded on reboot, so the appliance restores a clean,
# known-good state on each power cycle (great for a sealed kiosk).
#
# IMPORTANT: anything that must survive a reboot has to live on a separate
# writable mount — in particular:
#   - /etc/darwin-switch-agent  (cockpit config: config.json)
#   - the agent's log directory  (journald / file logs)
# Mount those persistently (e.g. via /etc/fstab to a writable partition) before
# enabling overlayroot, or their changes will vanish on the next boot.
#
# tmpfs:swap=1  -> overlay in tmpfs, allowed to spill to swap if RAM is tight.
# recurse=0     -> only the root mount is overlaid, not nested mounts (so the
#                  persistent writable mounts above stay genuinely writable).
overlayroot="tmpfs:swap=1,recurse=0"
