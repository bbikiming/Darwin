language = "C"
header = "// SPDX-License-Identifier: Apache-2.0\n// DarwinForge — auto-generated C bindings for forge-core.\n// Do not edit by hand. Regenerate with `scripts/build-mac.sh`.\n"
include_guard = "FORGE_CORE_H"
autogen_warning = "/* WARNING: GENERATED FILE — edit forge-ffi/src/lib.rs and rerun build. */"
cpp_compat = true
pragma_once = true
documentation = true
documentation_style = "c"

[parse]
parse_deps = false

[export]
item_types = ["enums", "structs", "opaque", "functions", "constants"]

[export.rename]
"FfiSerialPortInfo" = "fc_serial_port_info"
"FfiBoardSnapshot"  = "fc_board_snapshot"
"FfiJointState"     = "fc_joint_state"
"FfiBlobResult"     = "fc_blob_result"
"FfiFootTargets"    = "fc_foot_targets"
"FfiImuRaw"         = "fc_imu_raw"
"FcBus"             = "fc_bus"
"FcWalk"            = "fc_walk"

[enum]
prefix_with_name = true
