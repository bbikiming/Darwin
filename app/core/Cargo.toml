[workspace]
resolver = "2"
members = [
    "forge-core",
    "forge-cli",
    "forge-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
authors = ["bbikiming"]
license = "Apache-2.0"
repository = "https://github.com/bbikiming/darwin"

[workspace.dependencies]
thiserror = "1.0"
anyhow    = "1.0"
serde     = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap      = { version = "4.5", features = ["derive"] }
tracing   = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
