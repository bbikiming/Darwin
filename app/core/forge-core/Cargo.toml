[package]
name = "forge-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core library for DarwinForge — Dynamixel Protocol 1.0 + control loops for ROBOTIS DARwIn-OP / OP2."

[lib]
name = "forge_core"
# 2026-05-17: `staticlib` 제거 — `forge-ffi` package 의 동일 이름 `libforge_core.a`
# 출력과 collision 차단. forge-core 는 rlib (Rust inter-crate link) 만 필요 —
# forge-ffi 가 rlib 로 dependency 하고 자체 staticlib + cdylib 산출 (`libforge_core.a`).
crate-type = ["rlib"]

[dependencies]
thiserror.workspace = true
anyhow.workspace    = true
serde.workspace     = true
serde_json.workspace = true
tracing.workspace   = true
serialport = { version = "4.7", default-features = false }

# J13 (bus D0): macOS IOSSDATALAT ioctl 로 FTDI latency timer 16ms→1ms.
# macOS 전용 — 다른 플랫폼에선 미사용이므로 target-specific dependency.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
tracing-subscriber.workspace = true
