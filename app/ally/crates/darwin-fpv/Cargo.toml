[package]
name = "darwin-fpv"
description = "DARwIn FPV — ROG Ally 원격조종 런타임(안전·제어 코어). Tauri 셸은 Phase 3."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
df-wire = { path = "../df-wire" }
ally-link = { path = "../ally-link" }
ally-input = { path = "../ally-input" }
# §3 이벤트 페이로드 직렬화(콕핏 브리지) — 경량·기본 빌드 포함(단위검증 가능).
serde_json = "1"
# INV-2: 안전 런타임은 tauri 를 의존하지 않는다. 무거운 tauri 의존은 `cockpit`
# feature(Phase 3b 셸)에서만 들이고, 기본 빌드/테스트는 tauri-free·경량으로 둔다.
tauri = { version = "2", optional = true }

[build-dependencies]
tauri-build = { version = "2", optional = true }

[features]
# 콕핏 Tauri 셸(표시계층). 기본 OFF — 기본 빌드/테스트는 tauri-free·경량.
cockpit = ["dep:tauri", "dep:tauri-build"]

[lib]
name = "darwin_fpv"
path = "src/lib.rs"

[[bin]]
name = "darwin-fpv"
path = "src/main.rs"
