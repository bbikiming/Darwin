# DARwIn FPV — ROG Ally 콕핏 앱 워크스페이스.
#
# app/core 와는 의도적으로 분리된 독립 워크스페이스다: Windows 전용 의존
# (gilrs·wgpu·ssh2·tauri 등)이 Mac/iOS 가 소비하는 검증된 코어 워크스페이스의
# lock 파일·CI 표면을 오염시키지 않게 한다 (docs/03_ARCHITECTURE.md §6).
# forge-core 가 필요한 크레이트(ally-pose, W3)는 cross-workspace path 의존으로 연결한다.
#
# darwin-fpv 는 W1(Phase 2)에서 멤버로 추가됐다. Phase 2a 의 런타임 라이브러리는
# tauri 를 의존하지 않으므로(INV-2: EventSink 트레이트 경계) `cargo test` 는 가볍게
# 유지된다 — Tauri 의존은 Phase 3 셸에서 bin 쪽에만 들인다.

[workspace]
resolver = "2"
members = [
    "crates/df-wire",
    "crates/ally-link",
    "crates/ally-input",
    "crates/ally-pose",
    "crates/ally-cli",
    "crates/darwin-fpv",
    "crates/darwin-fpv-native",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
