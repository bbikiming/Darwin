name: DarwinForgeMobile
options:
  bundleIdPrefix: com.yuseok
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ko
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: JM4LJMU49Q
    CODE_SIGN_STYLE: Automatic
    ENABLE_BITCODE: NO
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "10"

packages:
  DarwinForgeMobile:
    path: ..

targets:
  OPPilot:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
        excludes:
          - "DarwinForgePilot-Info.plist"
    resources:
      - App/Assets.xcassets
    dependencies:
      - package: DarwinForgeMobile
        product: DarwinForgeMobileApp
      - package: DarwinForgeMobile
        product: MobilePilotKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yuseok.oppilot
        PRODUCT_NAME: OP Pilot
        INFOPLIST_FILE: App/DarwinForgePilot-Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        GENERATE_INFOPLIST_FILE: NO
