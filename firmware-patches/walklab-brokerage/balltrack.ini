; DarwinForge WalkLab 볼 트래킹 설정 (2026-06-03)
; 카메라 프레임 실측: 빨간 공 hue ~8, 채도 ~64%, 명도 ~39% (S/V 는 0~100 스케일).
;
; **균형 튜닝 (2026-06-03)**: 실측상 공이 눈앞에 있어도 검출률 ~40-60% 라 너무 조이면
; recall 이 더 떨어진다. 상수 false-positive(빨간 배경 매 프레임 오검)는 막되, 진짜 공은
; 잘 잡히도록 중간값. 잔여 노이즈는 코드의 공간게이트 + 끈끈한 추적이 흡수한다.
;   - min_saturation 40 : 칙칙한 배경(저채도) 배제, 공(S~64)은 여유.
;   - min_value      25 : 어두운 노이즈 배제, 공(V~39)은 그늘에도 여유.
;   - min_percent  0.15 : specks 배제하되 작/먼 공도 인정(0.05 너무 헐겁·0.30 너무 빡빡).
;   - max_percent  35   : 거대 적색 wash(오검) 배제.
;   - hue_tolerance 18  : 적색대(주변 적·주황 포함) — 모션블러 시 hue 번짐 흡수.

[Find Color]
hue             = 8
hue_tolerance   = 18
min_saturation  = 40
min_value       = 25
min_percent     = 0.15
max_percent     = 35.0

; 머리 tilt 상한 — 기본 40°라 공을 머리보다 높이 들면 상하 추적이 막혔다.
; 55°로 올려 위쪽 추적 범위 확보. (Head::LoadINISettings 가 읽음)
[Head Pan/Tilt]
top_limit       = 55

; **카메라 조도 초기화 (2026-06-03)** — ReloadBallColor 가 읽어 v4l2 적용 (재빌드 없이 튜닝).
; 종전 하드코딩 gain255/exposure2300 은 과노출 → 채도 washout → 배경 적색 오검출.
; ROBOTIS 프레임워크/싸커 데모 baseline 으로 초기화: gain 255, exposure 1000, manual.
; 너무 어두우면 exposure ↑(예 1500), 너무 밝아 색이 날아가면 ↓(예 700) 로 조절 후 볼트래킹 껐다 켜기.
[Camera]
auto_exposure   = 1
gain            = 255
exposure        = 1000
